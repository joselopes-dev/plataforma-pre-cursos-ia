services:
  # Serviço Web Full-Stack (Express API + React Frontend)
  - type: web
    name: lms-curso-tecnico-ia
    env: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: npm install && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: lms-ia-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: josel6449@gmail.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        sync: false

# Banco de Dados Gerenciado PostgreSQL no Render
databases:
  - name: lms-ia-postgres
    region: oregon
    plan: free
    databaseName: lms_ia_db
    user: lms_admin
